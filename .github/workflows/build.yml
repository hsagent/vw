name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag for the release"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: none

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -t . -v

      - name: Check Python syntax
        run: python -m compileall -q main.py classes gui src tests

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Package Application
        shell: cmd
        run: compile.bat --ci

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyProject
          path: output/MyProject.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: MyProject
          path: ./artifact-download

      - name: Verify Downloaded Artifact
        run: |
          echo "Listing artifact-download directory:"
          ls -la ./artifact-download
          if [ ! -f ./artifact-download/MyProject.exe ]; then
            echo "Error: File MyProject.exe not found in artifact-download directory!"
            exit 1
          fi

      - name: Prepare Release Body
        run: |
          # Create badges section
          cat > badges.md << 'EOF'

          [![Downloads](https://img.shields.io/github/downloads/hsagent/vw/${{ github.event.inputs.tag_name }}/total?style=for-the-badge&logo=github&color=8E44AD)](https://github.com/hsagent/vw/releases/tag/${{ github.event.inputs.tag_name }}) [![Platforms](https://img.shields.io/badge/platform-Windows-blue?style=for-the-badge&color=8E44AD)](https://github.com/hsagent/vw/releases/download/${{ github.event.inputs.tag_name }}/MyProject.exe) [![License](https://img.shields.io/github/license/hsagent/vw?style=for-the-badge&color=8E44AD)](https://github.com/hsagent/vw/blob/main/LICENSE)
          EOF
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            printf '\nPre-release build. Native CS2 overlay smoke testing has not been performed for this build.\n' >> badges.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: My Project - ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Release' }} ${{ github.event.inputs.tag_name }}
          body_path: ./badges.md
          generate_release_notes: true
          files: |
            ./artifact-download/MyProject.exe
          prerelease: ${{ github.event.inputs.prerelease }}

      - name: Send Telegram Notification
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🎉 New ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Release' }}: My Project ${{ github.event.inputs.tag_name }} has been published! Check it out: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag_name }}"

      - name: Send Telegram Notification on Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }} \
          -d text="🚨 ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Release' }} Failed: My Project ${{ github.event.inputs.tag_name }}. Check the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
